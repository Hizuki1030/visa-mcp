[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visa-mcp"
version = "1.0.0"
description = "Model Context Protocol server for VISA instrument control"
authors = [{ name = "User" }]
dependencies = [
    "fastmcp>=2.11.0",
    "pyvisa>=1.15.0",
    "aiohttp>=3.8.0"
]
requires-python = ">=3.11"

[project.scripts]
visa-mcp = "visa-mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visa-mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/visa-mcp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0"
]
